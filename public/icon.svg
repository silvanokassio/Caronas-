<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="carGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Background (Squircle / Rounded Container) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner subtle border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Dynamic Road / Commute Arc -->
  <path d="M 96 380 C 160 320, 220 330, 280 290 C 340 250, 380 210, 416 140" 
        fill="none" 
        stroke="url(#accentGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-dasharray="24 16"
        opacity="0.85" />

  <!-- Location Pin Destination -->
  <g transform="translate(416, 130)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="#10b981" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />
  </g>

  <!-- Car Silhouette & Speed lines -->
  <g transform="translate(136, 176)" filter="url(#glow)">
    <!-- Car Body -->
    <path d="M 32 104 
             L 60 48 
             C 68 32, 92 24, 120 24 
             L 170 24 
             C 198 24, 222 36, 236 56 
             L 256 92 
             L 272 96 
             C 284 100, 292 112, 292 126 
             L 292 152 
             C 292 160, 286 166, 278 166 
             L 264 166 
             C 260 144, 240 128, 216 128 
             C 192 128, 172 144, 168 166 
             L 112 166 
             C 108 144, 88 128, 64 128 
             C 40 128, 20 144, 16 166 
             L 8 166 
             C 4 166, 0 160, 0 152 
             L 0 124 
             C 0 112, 12 104, 32 104 Z" 
          fill="url(#carGrad)" />

    <!-- Car Windows -->
    <path d="M 68 88 
             L 88 52 
             C 94 42, 108 38, 124 38 
             L 144 38 
             L 144 88 Z" 
          fill="#0f172a" 
          opacity="0.8" />

    <path d="M 158 88 
             L 158 38 
             L 174 38 
             C 190 38, 204 46, 212 60 
             L 226 88 Z" 
          fill="#0f172a" 
          opacity="0.8" />

    <!-- Headlight beam -->
    <polygon points="284,116 330,104 330,136 284,128" fill="#38bdf8" opacity="0.6" />

    <!-- Wheels -->
    <circle cx="64" cy="166" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="8" />
    <circle cx="64" cy="166" r="12" fill="#ffffff" />

    <circle cx="216" cy="166" r="30" fill="#0f172a" stroke="#34d399" stroke-width="8" />
    <circle cx="216" cy="166" r="12" fill="#ffffff" />
  </g>

  <!-- Brand Typography / Tag -->
  <text x="256" y="440" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="42" 
        font-weight="900" 
        letter-spacing="2" 
        text-anchor="middle" 
        fill="#ffffff">
    CARONA<tspan fill="#34d399">FLOW</tspan>
  </text>
</svg>
